# Builds, signs, notarizes and publishes a stable Subspace desktop release on
# the self-hosted macOS release runner, as `make release-macos` does on a
# signer's Mac. Run it by hand on main after Release Please has created the
# release's draft and tag. The runner group `subspace-macos-signing` accepts
# only this workflow on main, and the `subspace-macos-signing` environment
# holds the signing secrets and needs a maintainer's approval. The tag must
# name a draft at a commit on main, so only reviewed code runs with the
# secrets. See subspace-desktop/docs/installation.md, "Publish from the
# release runner".
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to build and publish, such as subspace-desktop-v0.13.0
        required: true
      draft:
        description: Attach the archives but leave the release a draft
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, macos-signing]
    environment: subspace-macos-signing
    timeout-minutes: 150
    permissions:
      contents: write # Attach the archives to the draft and publish it.
      actions: write # Start packslip: a release published with this token starts no workflow.
    steps:
      # Main's code, before any of the tag's runs with the secrets: the tag
      # must name a draft release at a commit that is already on main.
      - name: Resolve the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^subspace-desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable Subspace desktop release tag: $TAG" >&2
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "release $TAG is not a draft; a published release is never changed" >&2
            exit 1
          fi
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          on_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$GITHUB_SHA" --jq .status)"
          case "$on_main" in
            ahead | identical) ;;
            *) echo "$TAG is at $commit, which is not on main ($on_main)" >&2; exit 1 ;;
          esac
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      # The commit just checked, not the tag name, which could move meanwhile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - name: Install the pinned tools
        working-directory: subspace-desktop
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          MISE_YES: "1"
          # Building and signing the app does not need the quality tool.
          MISE_DISABLE_TOOLS: cargo:rustqual
        run: mise install
      - name: Build, sign, notarize and publish
        working-directory: subspace-desktop
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft && '1' || '' }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          MISE_DISABLE_TOOLS: cargo:rustqual
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SUBSPACE_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.SUBSPACE_GITHUB_OAUTH_CLIENT_SECRET }}
        # `make release-macos` in the temporary keychain, which sets
        # SIGNING_IDENTITY and KEYCHAIN_PROFILE for it.
        run: mise exec -- bash scripts/package-macos-ci.sh --run make release-macos
      - name: Sign the published release with packslip
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # From the tag, as a published release's own packslip run would be.
        run: gh workflow run packslip.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
