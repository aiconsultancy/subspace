# Signs each Subspace desktop release with packslip (https://packslip.dev):
# a signed manifest of the release's files, their digests, platform and the
# `subspace` command, attached to the release as
# packslip.subspace-desktop.sigstore.json. The release itself is built,
# notarized and published from a desktop session by `make release-macos`, or
# on the release runner by release-macos.yml, which then starts this
# workflow on the tag; this workflow only signs what that published,
# keylessly with this workflow's identity. Sign every release from this one
# file, so consumers keep accepting later releases.
name: packslip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign, such as subspace-desktop-v0.8.0
        required: true

permissions: {}

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'subspace-desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read # Download the release assets; cannot change the release.
      id-token: write # Sign with this workflow's identity.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            subspace-desktop-v*) ;;
            *) echo "not a Subspace desktop release tag: $TAG" >&2; exit 1 ;;
          esac
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          {
            echo "tag=$TAG"
            echo "version=${TAG#subspace-desktop-v}"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        id: packslip
        with:
          project: github.com/${{ github.repository }}/subspace-desktop
          version: ${{ steps.release.outputs.version }}
          tag: ${{ steps.release.outputs.tag }}
          commit: ${{ steps.release.outputs.commit }}
          download: Subspace_*_darwin_arm64.zip
          bin: subspace=Subspace.app/Contents/MacOS/subspace
          resources: |
            app=archive:Subspace.app
          # Attestations need GitHub Enterprise Cloud in a private repository.
          attest: false
          upload: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # Attach the bundle to the release.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packslip-bundle
          path: packslip
      - name: Attach the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sign.outputs.tag }}
        run: |
          set -euo pipefail
          bundle=packslip/packslip.subspace-desktop.sigstore.json
          test -f "$bundle"
          gh release upload "$TAG" "$bundle" --repo "$GITHUB_REPOSITORY" --clobber
