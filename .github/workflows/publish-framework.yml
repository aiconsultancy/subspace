# Publishes the Subspace Framework crates to crates.io. The release workflow
# (release.yml) starts it on a new release tag, subspace-framework-v<version>,
# with `publish` set, after Release Please creates the release. crates.io
# trusts this workflow file for each crate (Trusted Publishing), so no token
# is stored: the publish job exchanges its GitHub identity for a token that
# lasts 30 minutes. Keep the file name: each crate's trusted publisher names
# it. See subspace-framework/docs/publishing.md.
#
# Run by hand without `publish`, it uploads nothing: it verifies, exchanges
# the identity and does the publish script's dry run.
name: publish-framework

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to crates.io. Only on a subspace-framework-v* tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-framework
  cancel-in-progress: false

env:
  # The Copilot SDK's build script downloads a CLI unless told not to.
  COPILOT_SKIP_CLI_DOWNLOAD: "1"
  CARGO_TERM_COLOR: never
  # Debug info is not needed to prove the packages build, and the runner's
  # disk is small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Package every crate and build each from its packaged copy
    # Linux: macOS minutes cost ten times as much on a private repository.
    # Every push to main has already passed the tests on macOS in the
    # pre-push hook, so this proves only what a publish needs.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: subspace-framework
    steps:
      - name: A publish runs only on a release tag
        if: inputs.publish
        working-directory: .
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/subspace-framework-v*) ;;
            *) echo "publish is set but the run is on $REF, not a subspace-framework-v* tag" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The release tag is on main
        if: inputs.publish
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "the tagged commit is not on main" >&2
            exit 1
          }
      - name: Install the system packages GPUI needs on Linux
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev
      - name: Install the Rust toolchain the workspace names
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
          cargo --version
      - name: Package every crate and build each from its packaged copy
        run: bash scripts/package-workspace.sh

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # Exchange this workflow's identity for a crates.io token.
    defaults:
      run:
        working-directory: subspace-framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain the workspace names
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish each crate in dependency order
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish.sh --ci
      - name: Dry run (uploads nothing)
        if: ${{ !inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/publish.sh --ci --dry-run
