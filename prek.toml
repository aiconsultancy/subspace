# Repository-wide hooks. prek runs in workspace mode: each project keeps its
# own prek.toml (see subspace-desktop/subspace/prek.toml), and its hooks see
# only that project's files.
#
# Install once with `prek install`; run by hand with `prek run --all-files`.

default_install_hook_types = ["pre-commit", "pre-push"]

# Vendored third-party files keep their upstream bytes.
exclude = "(^|/)vendor/|^subspace-desktop/subspace/\\.agents/skills/"

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", args = ["--branch", "main"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-illegal-windows-names" },
    { id = "check-symlinks" },
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
    { id = "detect-private-key" },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
]
