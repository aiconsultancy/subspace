services:
  postgres:
    image: postgres:17.12-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: subspace
      POSTGRES_USER: subspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subspace-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - subspace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subspace", "-d", "subspace"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://subspace:${POSTGRES_PASSWORD:-subspace-local}@postgres:5432/subspace}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      SSE_MAX_STREAMS_PER_USER: ${SSE_MAX_STREAMS_PER_USER:-16}
      SSE_MAX_STREAMS: ${SSE_MAX_STREAMS:-256}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-true}
      NODE_ENV: ${NODE_ENV:-development}
      DEV_CONTAINER_LOCAL_ONLY: "true"
      AUTH_PROVIDERS: ${AUTH_PROVIDERS:-dev}
      DEV_CHANNELS: ${DEV_CHANNELS:-#subspace}
      DEV_IRC_HOST: ${DEV_IRC_HOST:-127.0.0.1}
      DEV_IRC_PORT: ${DEV_IRC_PORT:-${IRC_PLAIN_PORT:-6667}}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_ISSUER: ${WORKOS_ISSUER:-https://api.workos.com/}
      WORKOS_AUDIENCE: ${WORKOS_AUDIENCE:-}
      WORKOS_JWKS_URL: ${WORKOS_JWKS_URL:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:-}
      GITHUB_ORGANISATION_ID: ${GITHUB_ORGANISATION_ID:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
      GITHUB_POLL_INTERVAL_SECONDS: ${GITHUB_POLL_INTERVAL_SECONDS:-120}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      ENTRA_SCOPE: ${ENTRA_SCOPE:-API.Access}
      ENTRA_ADMIN_ROLE: ${ENTRA_ADMIN_ROLE:-}
      RESERVED_USERNAMES: ${RESERVED_USERNAMES:-}
      IRC_CREDENTIAL_SECRET: ${IRC_CREDENTIAL_SECRET:-}
      IRC_CREDENTIAL_SECRET_FILE: ${IRC_CREDENTIAL_SECRET_FILE:-}
      IRC_AUTH_HOOK_TOKEN: ${IRC_AUTH_HOOK_TOKEN:-}
      IRC_AUTH_HOOK_TOKEN_FILE: ${IRC_AUTH_HOOK_TOKEN_FILE:-}
      IRC_AUTH_ORGANISATION: ${IRC_AUTH_ORGANISATION:-}
      # Passed through only when set: an empty AUTO_REGISTER turns registration off.
      AUTO_REGISTER:
      AGENT_PORT: ${AGENT_PORT:-}
      AGENT_HOST: ${AGENT_HOST:-}
      AGENT_ORGANISATION: ${AGENT_ORGANISATION:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - subspace_api_data:/app/.data

volumes:
  subspace_postgres:
  subspace_api_data:
