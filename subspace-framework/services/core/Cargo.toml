[package]
name = "subspace-core"
documentation = "https://docs.rs/subspace-core"
description = "Subspace Framework core: config file, credentials, HTTP agent, state and PATH lookup. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
subspace-product.workspace = true
dirs.workspace = true
hex.workspace = true
keyring.workspace = true
rand.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
base64.workspace = true

[lints]
workspace = true
