[package]
name = "subspace-agent-tools"
documentation = "https://docs.rs/subspace-agent-tools"
description = "Subspace Framework: the agent tool interface boards advertise, with batched writes. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Credentials without the environment or CLIs, and recording approvals and
# monitors, for the boards' tool tests.
test-support = []

[dependencies]
base64.workspace = true
subspace-search.workspace = true
subspace-web.workspace = true
async-trait = "0.1"
subspace-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
