# Hooks for the Subspace Framework workspace. In this repository the root
# prek.toml adds file hygiene and installs both hook types.
#
# Commits check Rust formatting and scan for secrets.
# Push checks are selected in the root prek.toml.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rust-fmt"
name = "framework: cargo fmt --check"
entry = "mise run fmt-check"
language = "system"
files = "\\.rs$|^\\.rustfmt\\.toml$"
pass_filenames = false

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
