[package]
name = "subspace-board-command"
documentation = "https://docs.rs/subspace-board-command"
description = "Subspace Framework: headless board commands generated from the capability catalog. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[dependencies]
subspace-agent-tools.workspace = true
subspace-product.workspace = true
subspace-mcp.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait = "0.1"
usage = { package = "usage-lib", version = "=7.3.0", default-features = false, features = ["cli-help"] }

[dev-dependencies]
subspace-product = { workspace = true, features = ["test-support"] }
subspace-agent-tools = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }

[lints]
workspace = true
