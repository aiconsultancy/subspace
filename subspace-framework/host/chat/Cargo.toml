[package]
name = "subspace-chat"
documentation = "https://docs.rs/subspace-chat"
description = "Subspace Framework: the app-wide chat panel and its runtime lifecycle. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
