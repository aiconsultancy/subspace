[dependencies]
chrono.workspace = true
dirs.workspace = true
subspace-charts.workspace = true
subspace-agent.workspace = true
subspace-core.workspace = true
subspace-dashboard.workspace = true
subspace-lucide.workspace = true
gpui-kit.workspace = true

[dev-dependencies]
subspace-agent = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image.workspace = true
subspace-github-auth.workspace = true
tempfile.workspace = true

[lints]
workspace = true
