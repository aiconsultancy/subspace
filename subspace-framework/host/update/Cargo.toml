[package]
name = "subspace-update"
documentation = "https://docs.rs/subspace-update"
description = "Subspace Framework updater: checks and installs an app's own GitHub releases. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
subspace-core.workspace = true
subspace-product.workspace = true
flate2.workspace = true
hex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustls.workspace = true
tar.workspace = true
tempfile.workspace = true
ureq.workspace = true
zip.workspace = true
usage = { package = "usage-lib", version = "=7.3.0", default-features = false, features = [
    "cli-help",
] }

[dev-dependencies]
subspace-product = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
