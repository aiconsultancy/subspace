[package]
name = "subspace-mcp"
documentation = "https://docs.rs/subspace-mcp"
description = "Subspace Framework: the MCP server for the agent tools boards advertise. Internal crate; apps depend on `subspace-framework`."
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
subspace-agent-tools.workspace = true
subspace-core.workspace = true
subspace-search.workspace = true
subspace-product.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The official Rust SDK. 3.x implements MCP 2026-07-28 and still answers
# clients that open with an `initialize` handshake.
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# The `--attach` relay's plain-HTTP client to the app's loopback endpoint.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"
tower-service = "0.3"
usage = { package = "usage-lib", version = "=7.3.0", default-features = false, features = [
    "cli-help",
] }

[dev-dependencies]
subspace-agent-tools = { workspace = true, features = ["test-support"] }
hyper = { version = "1", features = ["client", "http1"] }
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
serde.workspace = true
subspace-product = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
