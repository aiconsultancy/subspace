# This package is excluded from the workspace (see the root `Cargo.toml`)
# because it depends on the Zig-built terminal runtime, so every field is
# declared explicitly, including the Framework path and the Markdown patch.
[package]
name = "subspace-terminal-panel"
description = "The shell-docked terminal panel with local shell sessions"
version = "0.13.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[patch.crates-io]
gpui-base = { path = "../../../subspace-framework/vendor/gpui-base" }
markdown = { path = "../../../subspace-framework/vendor/markdown" }

[dependencies]
subspace-framework = { path = "../../../subspace-framework", version = "0.9.0" }
subspace-ghostty-config = { path = "../ghostty-config" }
subspace-terminal = { path = "../runtime" }
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["gpui-fast", "test-support"] }

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
type_complexity = "allow"
