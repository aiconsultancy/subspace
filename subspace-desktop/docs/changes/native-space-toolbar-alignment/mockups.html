}

function detailTools(space) {
  const path = (parent, key) => '<div class="path">' + (parent ? clip(parent) + icon('next') : '') + '<strong class="clip">' + key + '</strong></div>';
  switch (ui.space) {
    case 'issues': return [[back('Back to issues'), path('NAV · Navigation', space.key)], [control('Edit issue…', 'edit'), control('More', 'more')]];
    case 'decisions': {
      const history = control(ui.history ? 'Hide revision history' : 'Revision history', 'clock', { look: ui.history ? 'latched' : 'quiet', iconOnly: true, action: 'history' });
      const review = ui.decisions === 'proposal' || ui.decisions === 'idle';
      let right = [history, refresh()];
      if (ui.decisions === 'accepted') right.push(control('Propose replacement', 'plus'));
      if (review) right = [history, control('Edit', 'edit', { look: 'quiet', iconOnly: true }), control('Reject', 'close'), refresh(), primary('Accept', 'check', 'accept')];
      return [[back('Back to decisions'), path('', space.key)], right];
    }
    case 'prs': {
      const mode = ui.prs;
      const right = [quiet('Files', 'files')];
      if (mode !== 'merged') right.push(quiet('Close pull request…', 'close'));
      if (mode === 'review') right.push(quiet('Merge pull request…', 'pr'), refresh(), primary('Approve', 'check', 'approve'));
      if (mode === 'ready') right.push(quiet('Approve', 'check'), refresh(), primary('Merge…', 'pr', 'merge'));
      if (mode === 'blocked') right.push(refresh(), control('Merge…', 'pr', { disabled: true, title: 'Merge is blocked by pending checks' }));
      if (mode === 'merged') right.unshift(refresh());
      return [[back(ui.origin ? 'Back to #flight-ops' : 'Back to Needs review'), path('octo-org/api', space.key)], right];
    }
    case 'actions': return [[back('Back to Runs'), path('', space.key)], [refresh()]];
    case 'projects': return [[back('Back to milestones'), pick('Design Studio'), control('Overview'), control('Milestones', '', { look: 'latched' })], [refresh()]];
    case 'copilot': return [[back('Back to the list')], [control('Open on GitHub', 'open')]];
    default: return listTools(space);
  }
}

function toolbar(space, detail) {
  const [left, right] = detail ? detailTools(space) : listTools(space);
  const strip = ['projects', 'channels'].includes(ui.space);
  return '<div class="toolbar' + (detail ? ' detail' : '') + (strip ? ' strip-only' : '') + '"><div class="tools start">' + left.join('') +
    '</div><div class="tools end">' + right.join('') + '</div></div>';
}

function navigator(space) {
  const select = ui.space === 'projects' ? 'Navigation' : space.view;
  const rows = (list, glyph) => list.map(name => '<div class="nav-row' + (select === name ? ' selected' : '') + '">' + icon(glyph) + clip(name) + '</div>').join('');
  return '<aside class="nav"><div class="strip">' + clip(space.name) + '</div><div class="nav-body">' + rows(space.nav, space.icon) +
    (space.projects ? '<div class="nav-label">' + (['prs','actions','copilot'].includes(ui.space) ? 'Repositories' : 'Projects') + '</div>' + rows(space.projects, 'folder') : '') +
    '</div></aside>';
}

const facts = (title, rows) => '<section class="fact-group"><h5>' + title + '</h5>' + rows.map(([label, value]) =>
  '<div class="fact"><span>' + label + '</span><span>' + value + '</span></div>').join('') + '</section>';
const linkedIssues = () => '<section class="fact-group"><h5>Linked issues</h5>' +
  [['NAV-12', 'Show a course correction preview'], ['NAV-5', 'Calibrate fixtures']].map(([key, title]) =>
    '<button class="linked" data-action="issue" title="' + key + ' ' + title + '">' + icon('issue') + clip(key + ' ' + title) + '</button>').join('') + '</section>';
const stateLine = space => '<div class="state ' + space.tone + '">' + icon(space.icon) + space.state + '</div>';
const prCheck = () => ui.prs === 'blocked' ? 'Pending' : 'Passed';

function inspector(space, detail) {
  if (ui.space === 'projects') {
    if (!ui.projectInspector) return '';
    const heading = detail ? 'Milestone' : 'Project';
    const close = control('Close inspector', 'close', { look: 'quiet', iconOnly: true, action: 'project-inspector' });
    const body = facts('Properties', detail ? space.milestoneFacts : space.projectFacts) +
      (detail ? '<section class="fact-group"><h5>Issue progress</h5><div class="issue-progress"><progress value="4" max="6" aria-label="Issues done"></progress><span>4 of 6 issues done</span></div></section>' : '');
    return '<aside class="inspect"><div class="strip">' + clip(heading) + close +
      '</div><div class="inspect-body">' + body + '</div></aside>';
  }
  if (ui.space === 'channels') return '<aside class="inspect"><div class="strip">Channel</div><div class="inspect-body">' +
    facts('In play here', [['PR', 'api #421'], ['Issue', 'NAV-12']]) + facts('Conversation', [['Topic', 'Flight operations'], ['Members', '8 online']]) + '</div></aside>';
  const empty = ui.space === 'decisions' && !detail && ui.decisions === 'idle';
  const propertiesOnly = detail && ['issues', 'decisions'].includes(ui.space);
  const heading = empty ? 'Decision' : propertiesOnly && ui.space === 'issues' ? 'Properties' :
    ui.space === 'decisions' ? 'Decision' : ui.space === 'prs' ? 'api #421' : space.key;
  const open = detail || empty ? '' : control('Open', 'open', { action: 'open' });
  const lead = propertiesOnly ? '' : stateLine(space) + '<h4>' + space.title + '</h4>' +
    (space.summary ? '<p class="excerpt">' + space.summary + '</p>' : '');
  const panels = ui.space === 'decisions' ? linkedIssues() :
    ui.space === 'prs' ? facts('Reviewers', [['Lee Morgan', ui.prs === 'review' ? 'Requested' : 'Approved']]) + facts('Checks', [['CI', prCheck()], ['Lint', 'Passed']]) : '';
  const body = empty ? '<p class="excerpt muted">Select a decision to see it here.</p>' :
    lead + facts('Properties', ui.space === 'decisions' && detail ? [['Status', space.state], ...space.facts] : space.facts) + panels;
  return '<aside class="inspect"><div class="strip">' + clip(heading) + open +
    control('Close inspector', 'close', { look: 'quiet', iconOnly: true }) + '</div><div class="inspect-body">' + body + '</div></aside>';
}

function rows(space) {
  const hasSelection = ui.space !== 'decisions' || ui.decisions !== 'idle';
  return space.rows.map(([id, title, lane], index) => '<button class="row' + (hasSelection && index === 0 ? ' selected' : '') +
    '" data-action="open">' + icon(space.icon) + (id ? '<span class="key">' + id + '</span>' : '') + clip(title) + '<span class="lane">' + lane + '</span></button>').join('');
}
const workflow = (labels, current) => '<div class="workflow">' + labels.map((label, index) => '<div class="step' +
  (index <= current ? ' done' : '') + (index === current ? ' current' : '') + '">' + label + '</div>').join('') + '</div>';
const title = (name, meta) => '<h3>' + name + '</h3><p class="meta">' + meta + '</p>';

function listBody(space) {
  if (ui.space === 'projects') return '<div class="scroll"><article class="reading">' + title('Navigation', 'Design Studio') + (ui.projectInspector ? '' : facts('Properties', space.projectFacts)) +
    workflow(['Backlog', 'Planned', 'Started', 'Completed'], 2) + '<div class="group">Milestones</div>' + rows(space) + '</article></div>';
  return '<div class="list"><div class="group">' + icon('down') + icon(space.icon) + space.group + ' <span>' + space.rows.length + '</span></div>' + rows(space) +
    '<div class="group">' + icon('next') + (ui.space === 'decisions' ? 'Earlier decisions' : 'Earlier items') + '</div></div>';
}

function detailBody(space) {
  let content = '';
  switch (ui.space) {
    case 'issues': content = title(space.title, space.key + ' · Opened by Lee Morgan') +
      workflow(['Triage', 'Backlog', 'Todo', 'In progress', 'Done'], 3) + '<h4>Summary</h4><p>' + space.summary + '</p><h4>Description</h4><p>Use the existing simulator inputs to preview the new track before confirming.</p>'; break;
    case 'decisions': content = (ui.history || ui.decisions === 'history' ? '<h4>Revision history</h4><p class="meta">Revision 2 · Current &nbsp; / &nbsp; Revision 1 · Initial proposal</p>' : '') +
      title(space.title, space.key + ' · ' + space.state + ' · 27 November') + '<h4>Decision</h4><p>Read the latest relay position and confirm its timestamp before issuing each burn command.</p><h4>Why</h4><p>A stale reading can leave operators comparing the new heading with an old position.</p>'; break;
    case 'prs': content = stateLine(space) + title(space.title, 'octo-org/api ' + space.key) + '<h4>Description</h4><p>' + space.summary +
      '</p><h4>Checks</h4><p>CI · ' + prCheck() + '</p>'; break;
    case 'actions': content = title(space.title, space.key + ' · Succeeded') + facts('Details', space.facts) +
      '<h4>Jobs</h4><p class="state green">' + icon('check') + ' Build · 1m 12s</p><p class="state green">' + icon('check') + ' Tests · 2m 06s</p>'; break;
    case 'projects': content = title(space.title, 'Navigation') +
      (ui.projectInspector ? '' : facts('Properties', [...space.milestoneFacts, ['Issue progress', '4 of 6 issues done']])) +
      '<p>Complete the guidance preview and check it against simulator runs.</p>' + linkedIssues(); break;
    case 'copilot': content = title(space.title, space.key + ' · In progress') + '<h4>Task</h4><p>' + space.summary + '</p><h4>Activity</h4><p>Reviewed simulator fixture and updated the guidance checklist.</p>'; break;
  }
  return '<div class="scroll"><article class="reading">' + content + '</article></div>';
}

function transcript() {
  return '<div class="transcript scroll"><div class="message"><b>Lee Morgan</b><time>15:21</time><p>Could you check the relay validation changes before the next simulation?</p></div>' +
    '<div class="message"><b>Sam Park</b><time>15:24</time><p>The pull request is ready for review. ' +
    control('octo-org/api #421', 'pr', { action: 'channel-pr' }) + '</p></div>' +
    '<div class="message"><b>Lee Morgan</b><time>15:25</time><p>I’ll check the timestamp handling and the fixture.</p></div></div>' +
    '<div class="composer">Message #flight-ops</div>';
}

function windowMock(space, detail) {
  const project = ui.space === 'projects';
  const channel = ui.space === 'channels';
  const top = Object.values(spaces).map(item => '<span class="space' + (item.name === space.name ? ' current' : '') + '">' +
    icon(item.icon) + item.name + '</span>').join('');
  const tabs = project || channel ? '' : '<div class="strip tabs"><div class="tab' + (!detail ? ' current' : '') + '">' + icon(space.icon) + space.view +
    '</div>' + (detail ? '<div class="tab current">' + icon(space.icon) + clip(space.tab + ' ' + space.title) + icon('close') + '</div>' : '') + '</div>';
  const body = channel ? transcript() : detail ? detailBody(space) : listBody(space);
  const hideInspector = project && !ui.projectInspector;
  const inspectorSwitch = project
    ? control(hideInspector ? 'Show inspector' : 'Hide inspector', 'dock', { look: 'quiet', iconOnly: true, action: 'project-inspector' })
    : icon('dock');
  return '<div class="app"><div class="menubar">' + top + '</div><div class="workspace' + (project ? ' project-workspace' : '') + (hideInspector ? ' no-inspector' : '') + '">' +
    navigator(space) + '<section class="record" aria-label="' + (detail ? 'Detail pane' : 'Main pane') + '">' + tabs + toolbar(space, detail) + body + '</section>' +
    inspector(space, detail) + '</div><div class="foot">' + (project ? '' : icon('dock')) + '<span>' + (channel ? 'Connected' : 'Design Studio') + '</span><span>Updated just now</span>' + inspectorSwitch + '</div></div>';
}

function currentSpace() {
  const base = spaces[ui.space];
  if (ui.space === 'decisions') {
    if (ui.decisions === 'accepted') return { ...base, state: 'Accepted', view: 'Accepted', group: 'Accepted', tone: 'green' };
    return base;
  }
  if (ui.space === 'prs' && ui.prs === 'merged') return { ...base, state: 'Merged', view: 'Recently merged', tone: 'purple' };
  return base;
}

const byId = id => document.getElementById(id);
byId('spaces').innerHTML = Object.entries(spaces).map(([key, value]) => '<button class="review-tab" data-space="' + key + '">' + icon(value.icon) + value.name + '</button>').join('');

function render(focus = '') {
  const space = currentSpace();
  const channel = ui.space === 'channels';
  byId('space-name').textContent = space.name;
  byId('note').textContent = ui.origin ? 'This PR was opened from #flight-ops. Use the Back arrow at the left of the detail toolbar to return.' : space.note;
  byId('layouts').hidden = channel;
  for (const button of document.querySelectorAll('[data-layout]')) button.setAttribute('aria-pressed', button.dataset.layout === ui.layout);
  for (const button of document.querySelectorAll('[data-space]')) button.setAttribute('aria-pressed', button.dataset.space === ui.space);
  const states = variants[ui.space];
  const oldState = document.activeElement?.dataset.state;
  byId('states').innerHTML = states ? '<div class="segments" aria-label="' + space.name + ' states">' + states.map(([key, label]) =>
    '<button data-state="' + key + '" aria-pressed="' + (ui[ui.space] === key) + '">' + label + '</button>').join('') + '</div>' : '';
  if (oldState) document.querySelector('[data-state="' + oldState + '"]')?.focus();
  const views = channel || ui.layout === 'list' ? [false] : ui.layout === 'detail' ? [true] : [false, true];
  byId('mocks').classList.toggle('single', views.length === 1);
  byId('mocks').innerHTML = views.map(detail => '<figure><figcaption>' + (channel ? 'Conversation' : detail ? 'Detail view' : 'List view') +
    '</figcaption>' + windowMock(space, detail) + '</figure>').join('');
  if (focus) document.querySelector('[data-action="' + focus + '"]')?.focus();
}

const confirmation = byId('confirmation');
function confirmChange(action) {
  const accept = action === 'accept';
  byId('confirm-title').textContent = accept ? 'Accept decision?' : 'Merge pull request?';
  byId('confirm-target').textContent = currentSpace().title;
  byId('confirm-action').textContent = accept ? 'Accept decision' : 'Merge pull request';
  confirmation.returnValue = '';
  confirmation.dataset.action = action;
  confirmation.showModal();
}

confirmation.addEventListener('close', () => {
  if (confirmation.returnValue !== 'confirm') return;
  if (confirmation.dataset.action === 'accept') {
    ui.decisions = 'accepted';
    ui.layout = 'detail';
  } else {
    ui.prs = 'merged';
  }
  render('back');
});

document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const { space, layout, state, action } = button.dataset;
  if (space) { ui.space = space; ui.layout = 'compare'; ui.origin = false; }
  if (layout) ui.layout = layout;
  if (state) {
    ui[ui.space] = state;
    if (ui.space === 'decisions') ui.history = state === 'history';
  }
  let focus = '';
  switch (action) {
    case 'open': ui.layout = 'detail'; focus = 'back'; break;
    case 'back':
      if (ui.origin) { ui.space = 'channels'; ui.origin = false; ui.layout = 'compare'; focus = 'channel-pr'; }
      else { ui.layout = 'list'; focus = 'open'; }
      break;
    case 'channel-pr': ui.space = 'prs'; ui.layout = 'detail'; ui.origin = true; ui.prs = 'review'; focus = 'back'; break;
    case 'project-inspector':
      ui.projectInspector = !ui.projectInspector;
      focus = 'project-inspector';
      break;
    case 'history': ui.history = !ui.history; focus = 'history'; break;
    case 'accept':
    case 'merge': confirmChange(action); return;
    case 'approve': ui.prs = 'ready'; focus = 'merge'; break;
    case 'issue': ui.space = 'issues'; ui.layout = 'detail'; focus = 'back'; break;
  }
  if (space || layout || state || action) render(focus);
});

render();
</script>
</body>
</html>
