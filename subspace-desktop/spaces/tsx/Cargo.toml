[package]
name = "subspace-tsx-board"
description = "Subspace dashboard: experimental TSX Spaces drawn by nsh packages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
subspace-framework.workspace = true
gpui-kit.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
subspace-tsx-system = { path = "crates/system" }
# nsh draws a package's content with GPUI Fast, the GPUI the workspace uses.
# Only the JS runtime and charts: no web views, shaders, editors, terminal,
# network or updater.
nsh-platform-gpui = { version = "=0.7.1", default-features = false, features = ["js", "plot"] }
nsh-base = { version = "=0.7.1", default-features = false }
nsh-engine = { version = "=0.7.1", default-features = false }
nsh-package = "=0.7.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
subspace-framework = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The headless text engine, to run a package against the host in tests.
nsh-core = { version = "=0.7.2", default-features = false }

[lints]
workspace = true
