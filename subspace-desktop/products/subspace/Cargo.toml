[package]
name = "subspace"
description = "Subspace work dashboards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
subspace-framework = { workspace = true, features = ["host", "search-onnx", "gpui-kit-text-patch"] }
subspace-api-client = { path = "../../clients/subspace-api" }
subspace-github-board = { path = "../../spaces/github" }
subspace-github-copilot-agents-board = { path = "../../spaces/github-copilot-agents" }
subspace-actions-board = { path = "../../spaces/actions" }
subspace-irc-board = { path = "../../spaces/irc" }
subspace-issues-board = { path = "../../spaces/issues" }
subspace-decisions-board = { path = "../../spaces/decisions" }
subspace-web-board = { path = "../../spaces/web" }
subspace-descriptor.workspace = true
subspace-terminal-panel = { path = "../../terminal/panel", optional = true }
url.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
subspace-board-lab-board = { path = "../../spaces/board-lab", optional = true }

[features]
default = ["report-issue"]
# Report issue, filing into the repository `build/config.rs` names.
report-issue = ["subspace-framework/report-issue"]
terminal = ["dep:subspace-terminal-panel"]
# Spaces that are not ready to ship. Neither is in `default`, so release and
# packaging builds leave them out. Each also turns on the descriptor's
# feature of the same name, so the descriptor lists exactly the Spaces this
# binary registers. Built in, each starts off until turned on in Settings.
# Board Lab, on macOS ARM64 only.
board-lab = ["dep:subspace-board-lab-board", "subspace-descriptor/board-lab"]
# The Framework's Component gallery.
component-gallery = [
    "subspace-framework/component-gallery",
    "subspace-descriptor/component-gallery",
]
# Both, for development: `make run-unreleased`, and the workspace lint and
# tests.
unreleased-spaces = ["board-lab", "component-gallery"]
# The debug-only screenshot capture build.
capture = ["subspace-framework/capture"]

[dev-dependencies]
subspace-framework = { workspace = true, features = ["test-support"] }
# The NETT zero-traffic test drives the shared initiative catalogue.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The build script's modules, tested through the app's tests.
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[build-dependencies]
subspace-descriptor.workspace = true
embed-resource = "3"
serde.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true

# The build script's config reader, `build/branding.rs`, and the shared
# setting rules, `build/settings.rs`, are included with `#[path]` by
# `build.rs` and by the app, which cargo-shear does not follow.
[package.metadata.cargo-shear]
ignored = ["serde", "serde_json", "url", "uuid"]

[lints]
workspace = true
