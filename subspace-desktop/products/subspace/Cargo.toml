[package]
name = "subspace"
description = "Subspace work dashboards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
subspace-framework = { workspace = true, features = ["host", "search-onnx", "gpui-kit-text-patch"] }
subspace-api-client = { path = "../../clients/subspace-api" }
subspace-client-fleet.workspace = true
subspace-github-board = { path = "../../spaces/github" }
subspace-github-copilot-agents-board = { path = "../../spaces/github-copilot-agents", optional = true }
subspace-actions-board = { path = "../../spaces/actions" }
subspace-irc-board = { path = "../../spaces/irc" }
subspace-issues-board = { path = "../../spaces/issues" }
subspace-projects-board = { path = "../../spaces/projects" }
subspace-decisions-board = { path = "../../spaces/decisions" }
subspace-web-board = { path = "../../spaces/web" }
subspace-tsx-board = { path = "../../spaces/tsx", optional = true }
subspace-descriptor.workspace = true
rustls.workspace = true
subspace-terminal-panel = { path = "../../terminal/panel", optional = true }
url.workspace = true
# Reads the connection file, `src/connection.rs`.
serde_json.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
subspace-space-lab-board = { path = "../../spaces/space-lab", optional = true }

[features]
default = ["report-issue", "agentsview"]
# Report issue, filing into the repository `build/config.rs` names.
report-issue = ["subspace-framework/report-issue"]
terminal = ["dep:subspace-terminal-panel"]
# Native web view of an AgentsView fleet server on macOS and Windows.
agentsview = ["subspace-web-board/agentsview", "subspace-descriptor/agentsview"]
# The Copilot chat engine and Copilot Agents Space. Not in `default`: the Copilot SDK's build script
# downloads the Copilot CLI and its runtime and the app embeds them (about
# 240 MB on macOS ARM64). Without it, Settings offers no Copilot engine and a
# saved Copilot choice is kept but not started. Build with
# `SUBSPACE_BUILD_FEATURES=copilot` (or `FEATURES="terminal copilot"`).
copilot = [
    "subspace-framework/copilot",
    "subspace-descriptor/copilot",
    "dep:subspace-github-copilot-agents-board",
]
# Spaces that are not ready to ship. Neither is in `default`, so release and
# packaging builds leave them out. Each also turns on the descriptor's
# feature of the same name, so the descriptor lists exactly the Spaces this
# binary registers. Built in, each starts off until turned on in Settings.
# Space Lab, on macOS ARM64 only.
space-lab = ["dep:subspace-space-lab-board", "subspace-descriptor/space-lab"]
# The Framework's Component gallery.
component-gallery = [
    "subspace-framework/component-gallery",
    "subspace-descriptor/component-gallery",
]
# TSX Spaces: signed nsh packages as native Spaces (experimental).
tsx-spaces = ["dep:subspace-tsx-board", "subspace-descriptor/tsx-spaces"]
# All of them, for development: `make run-unreleased`, and the workspace
# lint and tests.
unreleased-spaces = ["space-lab", "component-gallery", "tsx-spaces"]
# The debug-only screenshot capture build.
capture = ["subspace-framework/capture"]

[dev-dependencies]
subspace-framework = { workspace = true, features = ["test-support"] }
# The NETT zero-traffic test drives the shared initiative catalogue.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The build script's modules, tested through the app's tests.
serde.workspace = true
uuid.workspace = true

[build-dependencies]
subspace-descriptor.workspace = true
embed-resource = "3"
serde.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true

# The build script's config reader, `build/branding.rs`, and the shared
# setting rules, `build/settings.rs`, are included with `#[path]` by
# `build.rs` and by the app, which cargo-shear does not follow.
[package.metadata.cargo-shear]
ignored = ["serde", "serde_json", "url", "uuid"]

[lints]
workspace = true
