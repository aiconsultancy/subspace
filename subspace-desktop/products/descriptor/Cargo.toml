[package]
name = "subspace-descriptor"
description = "The Subspace App's product descriptor and its packaging metadata helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only the GPUI-free product types, so the packaging helper builds quickly.
subspace-framework = { workspace = true, default-features = false }

[features]
# Spaces outside the release build. Only the app turns these on, through its
# features of the same names, so the descriptor never lists a Space the
# binary does not register. The metadata helper builds without them, as a
# release does.
copilot = []
space-lab = []
component-gallery = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
