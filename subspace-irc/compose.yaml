services:
  irc:
    build:
      context: .
    init: true
    environment:
      IRC_SERVER_NAME: ${IRC_SERVER_NAME:-irc.localhost}
      IRC_ENABLE_PLAIN: ${IRC_ENABLE_PLAIN:-true}
      IRC_ENABLE_WS: ${IRC_ENABLE_WS:-true}
      IRC_WS_ORIGIN: ${IRC_WS_ORIGIN:-}
      IRC_BCRYPT_COST: ${IRC_BCRYPT_COST:-12}
      IRC_TLS_CERT: ${IRC_TLS_CERT:-}
      IRC_TLS_KEY: ${IRC_TLS_KEY:-}
      IRC_OPER_NAME: ${IRC_OPER_NAME:-}
      IRC_OPER_PASSWORD: ${IRC_OPER_PASSWORD:-}
      IRC_OPER_PASSWORD_FILE: ${IRC_OPER_PASSWORD_FILE:-}
      IRC_ACCOUNTS_JSON: ${IRC_ACCOUNTS_JSON:-}
      IRC_ACCOUNTS_FILE: ${IRC_ACCOUNTS_FILE:-}
      IRC_CHANNELS_JSON: ${IRC_CHANNELS_JSON:-}
      IRC_CHANNELS_FILE: ${IRC_CHANNELS_FILE:-}
      IRC_CHANNEL_FOUNDER: ${IRC_CHANNEL_FOUNDER:-}
      IRC_AUTH_API_URL: ${IRC_AUTH_API_URL:-}
      IRC_AUTH_API_TOKEN_FILE: ${IRC_AUTH_API_TOKEN_FILE:-}
      IRC_AUTH_API_TOKEN: ${IRC_AUTH_API_TOKEN:-}
      IRC_AUTH_API_CA_FILE: ${IRC_AUTH_API_CA_FILE:-}
      IRC_AUTH_PASSPHRASE_PREFIX: ${IRC_AUTH_PASSPHRASE_PREFIX:-}
      IRC_AUTH_API_ALLOW_HTTP: ${IRC_AUTH_API_ALLOW_HTTP:-false}
      IRC_AUTH_CERT_LOGINS: ${IRC_AUTH_CERT_LOGINS:-false}
      IRC_AUTH_API_CONCURRENCY: ${IRC_AUTH_API_CONCURRENCY:-}
      IRC_AUTH_LOCAL_ACCOUNTS: ${IRC_AUTH_LOCAL_ACCOUNTS:-}
      IRC_AUTH_LOCAL_ACCOUNTS_FILE: ${IRC_AUTH_LOCAL_ACCOUNTS_FILE:-}
      IRC_HISTORY_DATABASE: ${IRC_HISTORY_DATABASE:-sqlite}
      IRC_POSTGRES_HOST: ${IRC_POSTGRES_HOST:-}
      IRC_POSTGRES_PORT: ${IRC_POSTGRES_PORT:-5432}
      IRC_POSTGRES_USER: ${IRC_POSTGRES_USER:-ergo}
      IRC_POSTGRES_DATABASE: ${IRC_POSTGRES_DATABASE:-ergo_history}
      IRC_POSTGRES_SSL_MODE: ${IRC_POSTGRES_SSL_MODE:-disable}
      IRC_POSTGRES_PASSWORD_FILE: ${IRC_POSTGRES_PASSWORD_FILE:-}
      IRC_POSTGRES_PASSWORD: ${IRC_POSTGRES_PASSWORD:-}
    ports:
      - "${IRC_PLAIN_BIND:-127.0.0.1}:${IRC_PLAIN_PORT:-6667}:6667"
      - "${IRC_TLS_BIND:-127.0.0.1}:${IRC_TLS_PORT:-6697}:6697"
      - "${IRC_WS_BIND:-127.0.0.1}:${IRC_WS_PORT:-8097}:8097"
    volumes:
      - irc-data:/ircd
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:6697 -brief </dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 180s
    restart: unless-stopped

volumes:
  irc-data:
